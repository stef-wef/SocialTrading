name: Sync Myfxbook Trades

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trades von Myfxbook abholen
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          MYFXBOOK_ACCOUNT_ID_1: ${{ secrets.MYFXBOOK_ACCOUNT_ID_1 }}
          MYFXBOOK_ACCOUNT_ID_2: ${{ secrets.MYFXBOOK_ACCOUNT_ID_2 }}
        run: node scripts/fetch-trades.mjs

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live trades [skip ci]" && git push)
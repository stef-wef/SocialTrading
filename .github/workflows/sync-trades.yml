name: Sync Myfxbook Trades

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Puppeteer & Stealth installieren
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Verify scraper source
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD
          echo "=== FILE PREVIEW ==="
          sed -n '1,80p' scripts/fetch-trades.mjs
          echo "=== SEARCH ==="
          grep -n "NETZWERK\|Suche History\|bodyLength\|^(buy|sell)" scripts/fetch-trades.mjs || true

      - name: Trades scrapen
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: node scripts/fetch-trades.mjs

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live trades [skip ci]" && git push)
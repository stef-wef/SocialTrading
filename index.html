<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAG Markets | Strategien</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bgMain: '#050505',
                        boxBg: '#0f0f11',
                        boxBorder: '#1f1f22',
                        accent: '#CBFD5F',
                        textMuted: '#8b8b93'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; }
        ::-webkit-scrollbar { display: none; }
        .glass-nav {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="fixed top-0 w-full z-50 glass-nav px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-accent text-bgMain flex items-center justify-center font-bold shadow-[0_0_20px_rgba(203,253,95,0.3)]">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">TAG MARKETS</h1>
                <p class="text-[10px] text-textMuted uppercase tracking-widest font-semibold">AI Trading Portal</p>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-2 px-4 py-1.5 rounded-full bg-boxBg border border-boxBorder text-xs text-textMuted">
            <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span> Systems Online
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto px-6 mt-32 mb-20">
        
        <div class="mb-16 max-w-2xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-boxBg border border-boxBorder text-accent text-xs font-bold tracking-wide mb-6">
                <i class="fa-solid fa-robot"></i> VERIFIZIERTE STRATEGIEN
            </div>
            <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Investiere in messbare Performance.</h2>
            <p class="text-lg text-textMuted leading-relaxed">
                Keine Versprechen. Nur verifizierte Live-Daten, echtes Risikomanagement und transparente Trade-Historien direkt via MyFXBook.
            </p>
        </div>

        <!-- Dynamisches Grid -->
        <div id="strategy-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="col-span-full flex justify-center py-20">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-accent"></i>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Mock API Data
            const apiDataMock = [
                {
                    "id": "sonic-ai",
                    "name": "Sonic AI",
                    "badge": "Live & Verifiziert",
                    "description": "Slow, boring, consistent. Sonic AI ist darauf ausgelegt, stetig zu wachsen – Monat für Monat verifiziert.",
                    "stats": { "gain": "+28.77%", "drawdown": "0.86%", "trades": "595" },
                    "folderPath": "Strategies/Sonic.html",
                    "icon": "fa-bolt"
                }
            ];

            async function fetchStrategies() {
                return new Promise(resolve => setTimeout(() => resolve(apiDataMock), 400));
            }

            async function renderGrid() {
                const grid = document.getElementById('strategy-grid');
                const strategies = await fetchStrategies();
                grid.innerHTML = '';

                strategies.forEach(strat => {
                    const cardHTML = `
                        <div class="group bg-boxBg border border-boxBorder hover:border-accent/50 rounded-[2rem] p-8 relative overflow-hidden transition-all duration-500 flex flex-col">
                            <div class="absolute -right-20 -top-20 w-64 h-64 bg-accent/5 rounded-full blur-3xl group-hover:bg-accent/10 transition-colors"></div>
                            
                            <div class="flex justify-between items-start mb-8 relative z-10">
                                <div class="w-14 h-14 rounded-2xl bg-[#1a1a1d] border border-boxBorder flex items-center justify-center group-hover:scale-110 transition-transform duration-500">
                                    <i class="fa-solid ${strat.icon} text-accent text-2xl"></i>
                                </div>
                                <span class="px-3 py-1 bg-accent/10 text-accent text-xs font-bold rounded-full border border-accent/20">
                                    ${strat.badge}
                                </span>
                            </div>

                            <h3 class="text-3xl font-bold mb-3 relative z-10">${strat.name}</h3>
                            <p class="text-sm text-textMuted leading-relaxed mb-8 relative z-10">${strat.description}</p>

                            <div class="grid grid-cols-3 gap-4 mb-8 relative z-10">
                                <div>
                                    <p class="text-[10px] text-textMuted uppercase font-semibold mb-1">Rendite</p>
                                    <p class="text-sm font-bold text-white">${strat.stats.gain}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-textMuted uppercase font-semibold mb-1">Drawdown</p>
                                    <p class="text-sm font-bold text-white">${strat.stats.drawdown}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-textMuted uppercase font-semibold mb-1">Trades</p>
                                    <p class="text-sm font-bold text-white">${strat.stats.trades}</p>
                                </div>
                            </div>

                            <a href="${strat.folderPath}" class="mt-auto w-full py-4 bg-white text-black hover:bg-accent font-bold rounded-xl text-center text-sm transition-colors flex items-center justify-center gap-2 relative z-10">
                                Performance prüfen <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', cardHTML);
                });
            }
            renderGrid();
        });
    </script>
</body>
</html>
